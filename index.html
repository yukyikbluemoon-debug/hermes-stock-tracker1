<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080c10">
<title>Hermes</title>
<style>
:root {
  --bg:#080c10; --surface:#0f1923; --card:#131e2a; --border:#1c2d3e;
  --text:#e8edf3; --sub:#6b7f93; --green:#00d97e; --red:#ff4d6a;
  --blue:#3b9eff; --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}

/* SCREENS */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .35s;will-change:transform;overflow:hidden}
.screen.hidden{pointer-events:none}
#screen-list.hidden{transform:translateX(-100%);opacity:0}
#screen-detail.hidden{transform:translateX(100%);opacity:0}

/* TOPBAR */
.topbar{display:flex;align-items:center;padding:16px 20px 10px;gap:12px;flex-shrink:0;background:var(--bg)}
.topbar-title{font-size:18px;font-weight:700;flex:1}
.icon-btn{background:var(--card);border:1px solid var(--border);color:var(--sub);border-radius:12px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;flex-shrink:0}
.icon-btn:active{opacity:.7}

/* LAST UPDATED */
.last-updated{font-size:11px;color:var(--sub);padding:0 20px 8px;flex-shrink:0}

/* PULL TO REFRESH */
.ptr-wrap{position:relative;flex:1;overflow:hidden;display:flex;flex-direction:column}
.ptr-indicator{position:absolute;top:-44px;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px;transition:transform .2s;z-index:5}
.ptr-spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;margin-right:8px;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* LIST */
.list-scroll{flex:1;overflow-y:auto;padding:0 16px 100px}
.list-scroll::-webkit-scrollbar{display:none}

/* CARDS */
.stock-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color .2s,transform .1s;position:relative}
.stock-card:active{transform:scale(.985);border-color:var(--blue)}
.card-left{flex:1;min-width:0}
.card-sym{font-size:16px;font-weight:700}
.card-name{font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-mid{flex:1}
.card-mini-chart{height:36px;width:80px}
.card-right{text-align:right;flex-shrink:0}
.card-price{font-size:17px;font-weight:700}
.card-chg{font-size:12px;margin-top:3px}
.del-btn{position:absolute;right:-8px;top:-8px;width:22px;height:22px;border-radius:50%;background:#ff4d6a;color:#fff;border:none;font-size:13px;font-weight:700;display:none;align-items:center;justify-content:center;cursor:pointer;line-height:1}
.edit-mode .del-btn{display:flex}
.edit-mode .stock-card{border-color:#2a3a4a}
.green{color:var(--green)} .red{color:var(--red)}

/* ADD SHEET */
.add-sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:flex-end;transition:opacity .25s}
.add-sheet-bg.hidden{opacity:0;pointer-events:none}
.add-sheet{background:var(--surface);border-radius:24px 24px 0 0;padding:24px 20px 48px;width:100%}
.add-sheet h3{font-size:16px;font-weight:700;margin-bottom:16px}
.sym-input{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:14px;color:var(--text);font-size:16px;padding:14px 16px;outline:none;margin-bottom:12px;transition:border-color .2s}
.sym-input:focus{border-color:var(--blue)}
.sym-input::placeholder{color:var(--sub)}
.add-btn-main{width:100%;background:var(--blue);color:#fff;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:600;cursor:pointer}
.add-btn-main:active{opacity:.8}
.add-hint{font-size:11px;color:var(--sub);text-align:center;margin-top:10px}
.error-tag{color:var(--red);font-size:12px;padding:4px 0}

/* DETAIL TOP */
.detail-top{padding:10px 20px 0;flex-shrink:0}
.detail-sym{font-size:26px;font-weight:800;line-height:1}
.detail-name{font-size:12px;color:var(--sub);margin-top:3px}
.detail-price-row{display:flex;align-items:flex-end;gap:10px;margin-top:10px}
.detail-price{font-size:38px;font-weight:800;line-height:1}
.detail-chg{font-size:13px;font-weight:600;margin-bottom:5px}
.detail-baht{font-size:12px;color:var(--sub);margin-top:5px}
.detail-meta{display:flex;align-items:center;gap:8px;margin-top:6px}
.detail-status{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--sub);padding:3px 9px;background:var(--card);border-radius:20px;border:1px solid var(--border)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot.open{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot.closed{background:var(--sub)}
.det-updated{font-size:10px;color:var(--sub)}

/* RANGE BAR */
.range-wrap{padding:0 20px;margin-top:10px;flex-shrink:0}
.range-bar{height:3px;background:var(--border);border-radius:3px;position:relative;margin:5px 0 4px}
.range-fill{height:100%;border-radius:3px;position:absolute;left:0}
.range-dot-el{position:absolute;top:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;border:2px solid var(--bg)}
.range-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--sub)}

/* CHART TOGGLE */
.chart-toggle{display:flex;padding:6px 20px 0;gap:6px;flex-shrink:0}
.ctoggle{background:var(--card);border:1px solid var(--border);color:var(--sub);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer}
.ctoggle.active{background:rgba(59,158,255,.15);color:var(--blue);border-color:var(--blue)}

/* TIME TABS */
.time-tabs{display:flex;padding:8px 20px;gap:6px;flex-shrink:0;background:var(--bg)}
.tab{flex:1;background:var(--card);border:1px solid var(--border);color:var(--sub);border-radius:10px;padding:7px 0;font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:background .15s,color .15s}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}

/* CHART AREA — crosshair tooltip */
.chart-wrap{flex:1;position:relative;min-height:0;padding:4px 0 0}
.chart-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
.chart-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px}
.crosshair-tip{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:5px 12px;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;display:none;z-index:10}

/* STAT GRID */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 20px 20px;flex-shrink:0}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px 13px}
.stat-label{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
.stat-val{font-size:15px;font-weight:700;margin-top:3px}

/* MISC */
.empty-state{text-align:center;padding:60px 20px;color:var(--sub)}
.empty-state .ico{font-size:48px;margin-bottom:14px}
.empty-state p{font-size:14px;line-height:1.7}
.skel{background:var(--border);border-radius:6px;animation:shimmer 1.4s infinite}
@keyframes shimmer{0%,100%{opacity:.5}50%{opacity:1}}
.fab{position:fixed;bottom:28px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;font-size:26px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(59,158,255,.45);transition:transform .15s;z-index:10}
.fab:active{transform:scale(.92)}
</style>
</head>
<body>

<!-- LIST SCREEN -->
<div class="screen" id="screen-list">
  <div class="topbar">
    <div class="topbar-title">📈 Hermes</div>
    <div class="icon-btn" id="editBtn">✏️</div>
  </div>
  <div class="last-updated" id="listUpdated">กำลังโหลด…</div>
  <div class="ptr-wrap" id="ptrWrap">
    <div class="ptr-indicator" id="ptrIndicator">
      <div class="ptr-spinner" id="ptrSpinner" style="display:none"></div>
      <span id="ptrText">ดึงลงเพื่อรีเฟรช</span>
    </div>
    <div class="list-scroll" id="stockList">
      <div class="empty-state"><div class="ico">📉</div><p>กำลังโหลด…</p></div>

<!-- DETAIL SCREEN -->
<div class="screen hidden" id="screen-detail">
  <div class="topbar">
    <div class="icon-btn" id="backBtn" style="font-size:22px">←</div>
    <div class="topbar-title" id="det-topbar-sym"></div>
    <div style="width:38px"></div>
  </div>
  <div class="detail-top">

      <div class="detail-price" id="det-price">–</div>

    </div>
    <div class="detail-baht" id="det-baht"></div>

      <div class="detail-status"><span class="dot closed" id="det-dot"></span><span id="det-status-txt">–</span></div>

  <div class="chart-toggle">

<!-- ADD SHEET -->
<div class="add-sheet-bg hidden" id="addSheet">
  <div class="add-sheet">
    <h3>เพิ่มหุ้น / ETF</h3>
    <input class="sym-input" id="symInput" placeholder="เช่น AAPL, QQQ, MSFT" autocapitalize="characters" autocomplete="off" spellcheck="false">
    <div class="error-tag" id="addError"></div>
    <button class="add-btn-main" id="confirmAdd">เพิ่ม</button>
    <div class="add-hint">ใช้ symbol เดียวกับ Yahoo Finance / Twelve Data</div>
  </div>

<script>
/* ════════════════════════════════════════
   CONFIG
════════════════════════════════════════ */
const TD_KEY  = "457c304f76fe4a0f9280acab2b066165";
const TD_BASE = "https://api.twelvedata.com";

const DEFAULT_SYMS = [
  { sym:"VOO",  name:"Vanguard S&P 500 ETF" },
  { sym:"NVDA", name:"NVIDIA Corp" },
  { sym:"JEPQ", name:"JPMorgan Nasdaq Equity ETF" }
];

const TF_MAP = {
  "1D":{ interval:"5min",  outputsize:78  },
  "5D":{ interval:"15min", outputsize:130 },
  "1M":{ interval:"1h",    outputsize:160 },
  "6M":{ interval:"1day",  outputsize:130 },
  "1Y":{ interval:"1week", outputsize:52  }
};

/* ════════════════════════════════════════
   STATE
════════════════════════════════════════ */
let stocks      = [];
let editMode    = false;
let usdThb      = 33;
let db          = null;
let currentSym  = null;
let currentTf   = "1D";
let chartMode   = "line";   // "line" | "candle"
let detailTimer = null;
let currentCandles = [];    // เก็บสำหรับ crosshair

const cache = {};
function getCache(k){ const c=cache[k]; return c&&Date.now()-c.ts<55000?c.data:null }
function setCache(k,d){ cache[k]={ts:Date.now(),data:d} }

/* ════════════════════════════════════════
   DB
════════════════════════════════════════ */
async function initDb(){
  try{ db=await claude.use("db") }catch{ db=null }
  if(!db) return;
  const snap=await db.doc("data/stocks").get();
  if(snap.exists){ const d=snap.data(); if(Array.isArray(d.list)&&d.list.length){ stocks=d.list; return } }
  stocks=[...DEFAULT_SYMS];
  await db.doc("data/stocks").set({list:stocks});
}
async function saveStocks(){ if(db) try{ await db.doc("data/stocks").set({list:stocks}) }catch{} }

/* ════════════════════════════════════════
   FETCH
════════════════════════════════════════ */
async function tdQuote(sym){
  const k=`q_${sym}`, hit=getCache(k); if(hit) return hit;
  const r=await fetch(`${TD_BASE}/quote?symbol=${sym}&apikey=${TD_KEY}`,{signal:AbortSignal.timeout(6000)});
  const d=await r.json();
  if(d.status==="error"||!d.close) throw new Error(d.message||"ไม่พบ");
  setCache(k,d); return d;
}
async function tdSeries(sym,tf){
  const {interval,outputsize}=TF_MAP[tf];
  const k=`ts_${sym}_${tf}`, hit=getCache(k); if(hit) return hit;
  const r=await fetch(`${TD_BASE}/time_series?symbol=${sym}&interval=${interval}&outputsize=${outputsize}&apikey=${TD_KEY}`,{signal:AbortSignal.timeout(8000)});
  const d=await r.json();
  if(d.status==="error"||!d.values) throw new Error(d.message||"ไม่พบข้อมูลกราฟ");
  d.values=d.values.slice().reverse();
  setCache(k,d); return d;
}
async function getRate(){
  try{
    const r=await fetch("https://api.exchangerate-api.com/v4/latest/USD",{signal:AbortSignal.timeout(5000)});
    const d=await r.json(); usdThb=d.rates?.THB||33;
  }catch{ usdThb=33 }
}

function fmtTime(){
  return new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}

/* ════════════════════════════════════════
   MINI CHART (line only)
════════════════════════════════════════ */
function drawMini(canvas,closes,up){
  if(!canvas||closes.length<2) return;
  const ctx=canvas.getContext("2d"),dpr=devicePixelRatio||1;
  const w=canvas.offsetWidth,h=canvas.offsetHeight;
  canvas.width=w*dpr; canvas.height=h*dpr; ctx.scale(dpr,dpr);
  const mn=Math.min(...closes),mx=Math.max(...closes),rng=mx-mn||1;
  ctx.beginPath();
  closes.forEach((v,i)=>{
    const x=(i/(closes.length-1))*w, y=h-((v-mn)/rng)*(h-4)-2;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.strokeStyle=up?"#00d97e":"#ff4d6a"; ctx.lineWidth=1.5; ctx.lineJoin="round"; ctx.stroke();
}

/* ════════════════════════════════════════
   MAIN CHART
════════════════════════════════════════ */
function drawChart(canvas, candles, labels, prevClose, mode){
  if(!canvas||candles.length<2) return;
  const ctx=canvas.getContext("2d"), dpr=devicePixelRatio||1;
  const w=canvas.offsetWidth||canvas.parentElement?.offsetWidth||320;
  const h=canvas.offsetHeight||canvas.parentElement?.offsetHeight||160;
  canvas.width=w*dpr; canvas.height=h*dpr; ctx.scale(dpr,dpr);

  const padT=14, padB=32, padL=8, padR=8;
  const cw=w-padL-padR, ch=h-padT-padB;

  const highs  = candles.map(c=>c.high);
  const lows   = candles.map(c=>c.low);
  const closes = candles.map(c=>c.close);
  const mn=Math.min(...lows,  prevClose||Infinity);
  const mx=Math.max(...highs, prevClose||0);
  const rng=mx-mn||1;

  const px = i => padL + (i/(candles.length-1))*cw;
  const py = v => padT + ch - ((v-mn)/rng)*ch;

  // grid
  ctx.strokeStyle="rgba(255,255,255,0.04)"; ctx.lineWidth=1;
  for(let k=0;k<=4;k++){
    const y=padT+(k/4)*ch;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+cw,y); ctx.stroke();
  }

  // prev close baseline (เส้นประ)
  if(prevClose){
    const yBase=py(prevClose);
    ctx.save();
    ctx.strokeStyle="rgba(107,127,147,0.5)";
    ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(padL,yBase); ctx.lineTo(padL+cw,yBase); ctx.stroke();
    ctx.restore();
    // label
    ctx.fillStyle="rgba(107,127,147,0.8)";
    ctx.font=`9px -apple-system,sans-serif`;
    ctx.textAlign="right";
    ctx.fillText(prevClose.toFixed(2), padL+cw-2, yBase-3);
  }

  const lastClose = closes.at(-1);
  const up = lastClose >= (prevClose||closes[0]);
  const lineColor = up?"#00d97e":"#ff4d6a";

  if(mode==="candle"){
    // ══ CANDLESTICK ══
    const barW = Math.max(2, Math.min(12, cw/candles.length*0.7));
    candles.forEach((c,i)=>{
      const isUp = c.close >= c.open;
      const col  = isUp ? "#00d97e" : "#ff4d6a";
      const x    = px(i);
      // wick
      ctx.strokeStyle=col; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x,py(c.high)); ctx.lineTo(x,py(c.low)); ctx.stroke();
      // body
      const yO=py(c.open), yC=py(c.close);
      const bTop=Math.min(yO,yC), bH=Math.max(Math.abs(yC-yO),2);
      ctx.fillStyle = isUp ? col : col;
      // filled candle body
      if(isUp){
        ctx.strokeStyle=col; ctx.lineWidth=1.5;
        ctx.strokeRect(x-barW/2, bTop, barW, bH);
        ctx.fillStyle="rgba(0,217,126,0.15)";
        ctx.fillRect(x-barW/2, bTop, barW, bH);
      } else {
        ctx.fillStyle=col;
        ctx.fillRect(x-barW/2, bTop, barW, bH);
      }
    });

    // Volume bars (ล่าง)
    const vols = candles.map(c=>c.volume||0);
    const maxV = Math.max(...vols)||1;
    const volH = ch*0.18;
    candles.forEach((c,i)=>{
      const isUp=c.close>=c.open;
      const v=c.volume||0;
      const bH=(v/maxV)*volH;
      const x=px(i), barW2=Math.max(1,Math.min(10,cw/candles.length*0.65));
      ctx.fillStyle=isUp?"rgba(0,217,126,0.35)":"rgba(255,77,106,0.35)";
      ctx.fillRect(x-barW2/2, padT+ch-bH, barW2, bH);
    });

  } else {
    // ══ LINE CHART ══
    // fill
    const grad=ctx.createLinearGradient(0,padT,0,padT+ch);
    grad.addColorStop(0, up?"rgba(0,217,126,.22)":"rgba(255,77,106,.22)");
    grad.addColorStop(1,"rgba(0,0,0,0)");
    ctx.beginPath();
    ctx.moveTo(px(0),padT+ch);
    closes.forEach((v,i)=>ctx.lineTo(px(i),py(v)));
    ctx.lineTo(px(closes.length-1),padT+ch);
    ctx.closePath(); ctx.fillStyle=grad; ctx.fill();
    // line
    ctx.beginPath();
    closes.forEach((v,i)=>i===0?ctx.moveTo(px(i),py(v)):ctx.lineTo(px(i),py(v)));
    ctx.strokeStyle=lineColor; ctx.lineWidth=2; ctx.lineJoin="round"; ctx.stroke();

    // Volume bars (ล่าง)
    const vols=candles.map(c=>c.volume||0);
    const maxV=Math.max(...vols)||1;
    const volH=ch*0.15;
    candles.forEach((c,i)=>{
      const v=c.volume||0;
      const bH=(v/maxV)*volH;
      const x=px(i), barW=Math.max(1,Math.min(8,cw/candles.length*0.6));
      ctx.fillStyle=up?"rgba(0,217,126,0.2)":"rgba(255,77,106,0.2)";
      ctx.fillRect(x-barW/2, padT+ch-bH, barW, bH);
    });
  }

  // Time labels
  if(labels?.length){
    ctx.fillStyle="rgba(107,127,147,.75)";
    ctx.font=`10px -apple-system,sans-serif`;
    ctx.textAlign="center";
    const steps=Math.min(4,closes.length-1);
    for(let k=0;k<=steps;k++){
      const idx=Math.round((k/steps)*(closes.length-1));
      if(labels[idx]) ctx.fillText(labels[idx],px(idx),padT+ch+20);
    }
  }

  // เก็บ fn mapping สำหรับ crosshair
  canvas._chartInfo = { px, py, padT, padB, padL, padR, cw, ch, mn, mx, rng, candles, labels };
}

/* ════════════════════════════════════════
   CROSSHAIR
════════════════════════════════════════ */
function setupCrosshair(canvas){
  const tip = document.getElementById("crosshairTip");
  const wrap = document.getElementById("chartWrap");

  function onMove(clientX, clientY){
    if(!canvas._chartInfo) return;
    const {px,py,padL,padR,padT,padB,cw,ch,candles,labels,mn,rng}=canvas._chartInfo;
    const rect=canvas.getBoundingClientRect();
    const x=clientX-rect.left, y=clientY-rect.top;
    if(x<padL||x>rect.width-padR||y<padT||y>rect.height-padB){ hideCrosshair(); return; }
    const idx=Math.round((x-padL)/cw*(candles.length-1));
    if(idx<0||idx>=candles.length){ hideCrosshair(); return; }
    const c=candles[idx];
    // draw overlay
    const ctx=canvas.getContext("2d");
    const dpr=devicePixelRatio||1;
    // redraw
    drawChart(canvas,currentCandles,
      currentCandles.map((v,i)=>labels[i]),
      canvas._prevClose, chartMode);
    // crosshair lines
    const cx=px(idx), cy=py(c.close);
    ctx.save(); ctx.scale(dpr,dpr);
    ctx.strokeStyle="rgba(255,255,255,0.2)"; ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(cx,padT); ctx.lineTo(cx,padT+ch); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(padL,cy); ctx.lineTo(padL+cw,cy); ctx.stroke();
    ctx.restore();
    // dot
    ctx.save();
    ctx.fillStyle="#fff";
    ctx.beginPath(); ctx.arc(cx*dpr,cy*dpr,4*dpr,0,Math.PI*2); ctx.fill();
    ctx.restore();
    // tooltip
    const isUp=c.close>=c.open;
    tip.style.display="block";
    tip.style.color=isUp?"var(--green)":"var(--red)";
    tip.textContent=`${labels[idx]||""}  ${c.close.toFixed(2)}  O:${c.open.toFixed(2)}  H:${c.high.toFixed(2)}  L:${c.low.toFixed(2)}`;
  }
  function hideCrosshair(){
    tip.style.display="none";
    if(canvas._chartInfo)
      drawChart(canvas,currentCandles,
        currentCandles.map((v,i)=>canvas._chartInfo.labels[i]),
        canvas._prevClose, chartMode);
  }

  canvas.addEventListener("mousemove", e=>onMove(e.clientX,e.clientY));
  canvas.addEventListener("mouseleave", hideCrosshair);
  canvas.addEventListener("touchmove", e=>{ e.preventDefault(); const t=e.touches[0]; onMove(t.clientX,t.clientY) },{passive:false});
  canvas.addEventListener("touchend", hideCrosshair);
}

/* ════════════════════════════════════════
   LIST RENDER
════════════════════════════════════════ */
const priceCache={};

function renderList(){
  const el=document.getElementById("stockList");
  if(!stocks.length){
    el.innerHTML=`<div class="empty-state"><div class="ico">📋</div><p>ยังไม่มีหุ้น<br>กด + เพิ่มได้เลย</p></div>`;
    return;
  }
  el.innerHTML=stocks.map(s=>{
    const p=priceCache[s.sym];
    const priceHtml=p
      ?`<div class="card-price">${parseFloat(p.now).toFixed(2)}</div>
        <div class="card-chg ${p.up?"green":"red"}">${p.up?"+":""}${p.pct.toFixed(2)}%</div>`
      :`<div class="card-price skel" style="width:70px;height:18px;margin-bottom:6px"></div>
        <div class="skel" style="width:50px;height:12px"></div>`;
    return `<div class="stock-card" data-sym="${s.sym}">
      <div class="card-left"><div class="card-sym">${s.sym}</div><div class="card-name">${s.name}</div></div>
      <div class="card-mid"><canvas class="card-mini-chart" id="mini-${s.sym}"></canvas></div>
      <div class="card-right">${priceHtml}</div>
      <button class="del-btn" data-sym="${s.sym}">×</button>
    </div>`;
  }).join("");
  el.querySelectorAll(".stock-card").forEach(c=>{
    c.addEventListener("click",e=>{ if(!editMode) openDetail(c.dataset.sym) });
  });
  el.querySelectorAll(".del-btn").forEach(b=>{
    b.addEventListener("click",e=>{ e.stopPropagation(); removeSym(b.dataset.sym) });
  });
  Object.entries(priceCache).forEach(([sym,p])=>{
    if(!p?.closes?.length) return;
    const cv=document.getElementById(`mini-${sym}`);
    if(cv) requestAnimationFrame(()=>drawMini(cv,p.closes,p.up));
  });
  el.classList.toggle("edit-mode",editMode);
}

/* ════════════════════════════════════════
   LOAD LIST
════════════════════════════════════════ */
async function loadListPrices(){
  renderList();
  await Promise.all(stocks.map(async s=>{
    try{
      const [q,ts]=await Promise.all([tdQuote(s.sym),tdSeries(s.sym,"1D")]);
      const now=parseFloat(q.close),prev=parseFloat(q.previous_close);
      const chg=now-prev,pct=(chg/prev)*100;
      const closes=ts.values.map(v=>parseFloat(v.close));
      priceCache[s.sym]={now,prev,chg,pct,up:chg>=0,closes};
    }catch{}
  }));
  renderList();
  document.getElementById("listUpdated").textContent=`อัปเดต ${fmtTime()}`;
}

/* ════════════════════════════════════════
   DETAIL
════════════════════════════════════════ */
function openDetail(sym){
  const s=stocks.find(x=>x.sym===sym);
  currentSym=sym; currentTf="1D"; currentCandles=[];
  document.getElementById("det-topbar-sym").textContent=sym;
  document.getElementById("det-sym").textContent=sym;
  document.getElementById("det-name").textContent=s?.name||sym;
  document.getElementById("det-price").textContent="–";
  document.getElementById("det-chg").textContent="";
  document.getElementById("det-baht").textContent="";
  document.getElementById("det-updated").textContent="";
  document.getElementById("det-range-wrap").style.display="none";
  document.getElementById("statGrid").innerHTML="";
  document.getElementById("chartLoading").style.display="flex";
  document.getElementById("chartLoading").textContent="กำลังโหลดกราฟ…";
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tf==="1D"));
  document.getElementById("togLine").classList.add("active");
  document.getElementById("togCandle").classList.remove("active");
  chartMode="line";
  showScreen("detail");
  loadDetail(sym,"1D");
  clearInterval(detailTimer);
  detailTimer=setInterval(()=>{ if(currentSym===sym) loadDetail(sym,currentTf) },60000);
}

function closeDetail(){ clearInterval(detailTimer); currentSym=null; showScreen("list"); loadListPrices() }

async function loadDetail(sym,tf){
  document.getElementById("chartLoading").style.display="flex";
  document.getElementById("chartLoading").textContent="กำลังโหลดกราฟ…";
  try{
    const [q,ts]=await Promise.all([tdQuote(sym),tdSeries(sym,tf)]);
    if(currentSym!==sym) return;

    const now=parseFloat(q.close), prev=parseFloat(q.previous_close);
    const hi=parseFloat(q.high), lo=parseFloat(q.low), open=parseFloat(q.open);
    const chg=now-prev, pct=(chg/prev)*100, up=chg>=0;
    const color=up?"var(--green)":"var(--red)", sign=up?"+":"";

    document.getElementById("det-price").textContent=now.toFixed(2);
    document.getElementById("det-price").style.color=color;
    const ce=document.getElementById("det-chg");
    ce.textContent=`${sign}${chg.toFixed(2)} (${sign}${pct.toFixed(2)}%)`;
    ce.style.color=color;
    document.getElementById("det-baht").textContent=
      `≈ ${(now*usdThb).toLocaleString("th-TH",{maximumFractionDigits:0})} บาท`;
    document.getElementById("det-updated").textContent=`อัปเดต ${fmtTime()}`;

    const isOpen=q.is_market_open;
    document.getElementById("det-dot").className=`dot ${isOpen?"open":"closed"}`;
    document.getElementById("det-status-txt").textContent=isOpen?"ตลาดเปิด":"ตลาดปิด";

    if(tf==="1D"&&hi&&lo){
      const p2=hi>lo?((now-lo)/(hi-lo))*100:50;
      document.getElementById("rng-lo").textContent=lo.toFixed(2);
      document.getElementById("rng-hi").textContent=hi.toFixed(2);
      document.getElementById("rng-fill").style.cssText=`width:${p2.toFixed(1)}%;background:${color}`;
      document.getElementById("rng-dot").style.cssText=`left:${p2.toFixed(1)}%;background:${color}`;
      document.getElementById("det-range-wrap").style.display="block";
    } else {
      document.getElementById("det-range-wrap").style.display="none";
    }

    // build candle array
    currentCandles = ts.values.map(v=>({
      open:  parseFloat(v.open),
      high:  parseFloat(v.high),
      low:   parseFloat(v.low),
      close: parseFloat(v.close),
      volume:parseFloat(v.volume||0)
    }));
    const labels = ts.values.map(v=>{
      const d=new Date(v.datetime);
      return tf==="1D"||tf==="5D"
        ? d.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})
        : d.toLocaleDateString("th-TH",{month:"short",day:"numeric"});
    });

    const canvas=document.getElementById("mainCanvas");
    canvas._prevClose=prev;
    canvas._labels=labels;
    document.getElementById("chartLoading").style.display="none";
    requestAnimationFrame(()=>{
      drawChart(canvas,currentCandles,labels,prev,chartMode);
      setupCrosshair(canvas);
    });

    // stats
    const fi=q.fifty_two_week||{};
    const vol=parseFloat(q.volume||0);
    const mktCap=parseFloat(q.market_cap||0);
    const fmtCap=mktCap>=1e12?(mktCap/1e12).toFixed(2)+"T"
                :mktCap>=1e9?(mktCap/1e9).toFixed(2)+"B"
                :mktCap>0?(mktCap/1e6).toFixed(0)+"M":"–";
    document.getElementById("statGrid").innerHTML=`
      <div class="stat-box"><div class="stat-label">เปิด</div><div class="stat-val">${open.toFixed(2)}</div></div>
      <div class="stat-box"><div class="stat-label">ปิดก่อนหน้า</div><div class="stat-val">${prev.toFixed(2)}</div></div>
      <div class="stat-box"><div class="stat-label">52W High</div><div class="stat-val" style="color:var(--green)">${fi.high||"–"}</div></div>
      <div class="stat-box"><div class="stat-label">52W Low</div><div class="stat-val" style="color:var(--red)">${fi.low||"–"}</div></div>
      <div class="stat-box"><div class="stat-label">Mkt Cap</div><div class="stat-val">${fmtCap}</div></div>
      <div class="stat-box"><div class="stat-label">Volume</div><div class="stat-val">${vol>0?(vol/1e6).toFixed(1)+"M":"–"}</div></div>`;
  }catch(e){
    document.getElementById("chartLoading").textContent="โหลดไม่ได้: "+e.message;
  }
}

/* ════════════════════════════════════════
   ADD / REMOVE
════════════════════════════════════════ */
async function addSym(raw){
  const sym=raw.trim().toUpperCase();
  if(!sym) return "กรอก symbol ก่อน";
  if(stocks.find(s=>s.sym===sym)) return `${sym} มีอยู่แล้ว`;
  document.getElementById("addError").textContent="กำลังตรวจสอบ…";
  try{
    const q=await tdQuote(sym);
    stocks.push({sym,name:q.name||sym});
    await saveStocks(); return null;
  }catch(e){ return "ไม่พบ symbol: "+e.message }
}
async function removeSym(sym){
  stocks=stocks.filter(s=>s.sym!==sym);
  delete priceCache[sym];
  await saveStocks(); renderList();
}

/* ════════════════════════════════════════
   PULL TO REFRESH
════════════════════════════════════════ */
function initPullToRefresh(){
  const wrap=document.getElementById("ptrWrap");
  const scroll=document.getElementById("stockList");
  const ind=document.getElementById("ptrIndicator");
  const txt=document.getElementById("ptrText");
  const spinner=document.getElementById("ptrSpinner");
  let startY=0, pulling=false, refreshing=false;
  const THRESHOLD=70;

  wrap.addEventListener("touchstart",e=>{
    if(scroll.scrollTop===0) { startY=e.touches[0].clientY; pulling=true }
  },{passive:true});

  wrap.addEventListener("touchmove",e=>{
    if(!pulling||refreshing) return;
    const dy=e.touches[0].clientY-startY;
    if(dy<0){ pulling=false; return }
    const pull=Math.min(dy*0.5,THRESHOLD+20);
    ind.style.transform=`translateY(${pull}px)`;
    txt.textContent=pull>=THRESHOLD?"ปล่อยเพื่อรีเฟรช":"ดึงลงเพื่อรีเฟรช";
  },{passive:true});

  wrap.addEventListener("touchend",async e=>{
    if(!pulling||refreshing){ pulling=false; return }
    pulling=false;
    const dy=e.changedTouches[0].clientY-startY;
    if(dy*0.5<THRESHOLD){ ind.style.transform=""; return }
    // trigger refresh
    refreshing=true;
    spinner.style.display="block"; txt.textContent="กำลังรีเฟรช…";
    ind.style.transform=`translateY(${THRESHOLD}px)`;
    // bust cache
    Object.keys(cache).forEach(k=>delete cache[k]);
    await loadListPrices();
    ind.style.transform="";
    spinner.style.display="none"; txt.textContent="ดึงลงเพื่อรีเฟรช";
    refreshing=false;
  },{passive:true});
}

/* ════════════════════════════════════════
   SCREENS / EVENTS
════════════════════════════════════════ */
function showScreen(name){
  document.getElementById("screen-list").classList.toggle("hidden",name!=="list");
  document.getElementById("screen-detail").classList.toggle("hidden",name!=="detail");
}

document.getElementById("backBtn").addEventListener("click",closeDetail);

document.getElementById("timeTabs").addEventListener("click",e=>{
  const tab=e.target.closest(".tab");
  if(!tab||!currentSym) return;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  tab.classList.add("active"); currentTf=tab.dataset.tf;
  loadDetail(currentSym,currentTf);
});

// chart mode toggle
document.getElementById("togLine").addEventListener("click",()=>{
  chartMode="line";
  document.getElementById("togLine").classList.add("active");
  document.getElementById("togCandle").classList.remove("active");
  const canvas=document.getElementById("mainCanvas");
  if(currentCandles.length) requestAnimationFrame(()=>drawChart(canvas,currentCandles,canvas._labels,canvas._prevClose,"line"));
});
document.getElementById("togCandle").addEventListener("click",()=>{
  chartMode="candle";
  document.getElementById("togCandle").classList.add("active");
  document.getElementById("togLine").classList.remove("active");
  const canvas=document.getElementById("mainCanvas");
  if(currentCandles.length) requestAnimationFrame(()=>drawChart(canvas,currentCandles,canvas._labels,canvas._prevClose,"candle"));
});

document.getElementById("editBtn").addEventListener("click",()=>{
  editMode=!editMode;
  document.getElementById("editBtn").textContent=editMode?"✅":"✏️";
  renderList();
});
document.getElementById("addFab").addEventListener("click",()=>{
  document.getElementById("addSheet").classList.remove("hidden");
  document.getElementById("symInput").value="";
  document.getElementById("addError").textContent="";
  setTimeout(()=>document.getElementById("symInput").focus(),100);
});
document.getElementById("addSheet").addEventListener("click",e=>{
  if(e.target===document.getElementById("addSheet"))
    document.getElementById("addSheet").classList.add("hidden");
});
document.getElementById("confirmAdd").addEventListener("click",async()=>{
  const btn=document.getElementById("confirmAdd");
  btn.disabled=true; btn.textContent="กำลังเพิ่ม…";
  const err=await addSym(document.getElementById("symInput").value);
  btn.disabled=false; btn.textContent="เพิ่ม";
  if(err){ document.getElementById("addError").textContent=err; return }
  document.getElementById("addSheet").classList.add("hidden");
  await loadListPrices();
});
document.getElementById("symInput").addEventListener("keydown",e=>{
  if(e.key==="Enter") document.getElementById("confirmAdd").click();
});
window.addEventListener("resize",()=>{
  if(currentSym&&currentCandles.length){
    const canvas=document.getElementById("mainCanvas");
    drawChart(canvas,currentCandles,canvas._labels,canvas._prevClose,chartMode);
  }
});

   INIT
════════════════════════════════════════ */
(async()=>{
  await Promise.all([initDb(),getRate()]);
  if(!stocks.length) stocks=[...DEFAULT_SYMS];
  initPullToRefresh();
  await loadListPrices();
  setInterval(loadListPrices,60000);
})();
