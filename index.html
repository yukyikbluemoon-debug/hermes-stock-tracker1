<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e13">
<title>Hermes Stock Tracker</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0e13;
    color: #e6edf3;
    padding: 16px;
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .header h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.3px; }
  .refresh-btn {
    background: #1c2733;
    border: 1px solid #2a3441;
    color: #7d8590;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
  }
  .refresh-btn:hover { color: #e6edf3; border-color: #4d6277; }
  .refresh-btn.spinning { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Last updated ── */
  .last-updated {
    font-size: 11px;
    color: #555f6e;
    text-align: right;
    margin-bottom: 14px;
  }

  /* ── Card ── */
  .card {
    background: #141b24;
    border: 1px solid #1e2d3d;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .card:hover { border-color: #2a3f54; }

  /* skeleton shimmer */
  .card.loading::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .sym { font-size: 15px; font-weight: 700; }
  .name { font-size: 11px; color: #7d8590; margin-top: 3px; }
  .badge {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 20px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .badge.green { background: rgba(0,230,118,0.12); color: #00e676; }
  .badge.red   { background: rgba(255,82,82,0.12);  color: #ff5252; }

  .price { font-size: 28px; font-weight: 700; margin-top: 10px; line-height: 1; }
  .price.skeleton { width: 120px; height: 28px; background: #1e2d3d; border-radius: 6px; }

  .change { font-size: 13px; margin-top: 6px; }
  .change.skeleton { width: 150px; height: 14px; background: #1e2d3d; border-radius: 4px; margin-top: 8px; }

  .green { color: #00e676; }
  .red   { color: #ff5252; }
  .dim   { color: #7d8590; }

  .meta-row {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    font-size: 11px;
    color: #555f6e;
  }
  .baht { font-size: 11px; color: #7d8590; }

  /* ── Chart ── */
  .chart-wrap {
    margin-top: 14px;
    height: 80px;
    position: relative;
    border-radius: 8px;
    overflow: hidden;
  }
  .chart-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .chart-wrap.skeleton { background: #1a2433; }

  /* ── Error ── */
  .error-box {
    text-align: center;
    color: #ff5252;
    padding: 32px 20px;
    font-size: 13px;
    line-height: 1.7;
  }
  .error-box .icon { font-size: 28px; margin-bottom: 10px; }
  .retry-btn {
    margin-top: 14px;
    background: rgba(255,82,82,0.12);
    border: 1px solid rgba(255,82,82,0.3);
    color: #ff5252;
    border-radius: 10px;
    padding: 8px 20px;
    font-size: 13px;
    cursor: pointer;
  }

  /* ── Range bar ── */
  .range-bar {
    margin-top: 10px;
    position: relative;
    height: 3px;
    background: #1e2d3d;
    border-radius: 2px;
    overflow: visible;
  }
  .range-fill { height: 100%; border-radius: 2px; }
  .range-dot {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 2px solid #0a0e13;
  }
  .range-labels {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: #555f6e;
    margin-top: 5px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>📈 Hermes</h1>
  <button class="refresh-btn" id="refreshBtn" onclick="load()">⟳ รีเฟรช</button>
</div>
<div class="last-updated" id="lastUpdated">กำลังโหลด…</div>
<div id="list"></div>

<script>
/* ─────────────────────────────────────────────
   CONFIG
───────────────────────────────────────────── */
const COINS = [
  { sym: "VOO",  name: "Vanguard S&P 500 ETF" },
  { sym: "NVDA", name: "NVIDIA Corp" },
  { sym: "JEPQ", name: "JPMorgan Nasdaq Equity Premium ETF" }
];

// CORS proxies — tried in order until one works
const PROXIES = [
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => url   // last resort: direct (may fail due to CORS)
];

const YAHOO_URL = sym =>
  `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?range=1d&interval=5m`;

/* ─────────────────────────────────────────────
   FETCH WITH PROXY FALLBACK
───────────────────────────────────────────── */
async function fetchWithProxy(rawUrl) {
  for (const makeUrl of PROXIES) {
    try {
      const res = await fetch(makeUrl(rawUrl), {
        signal: AbortSignal.timeout(8000),
        headers: { "Accept": "application/json" }
      });
      if (!res.ok) continue;
      const json = await res.json();
      // validate shape
      if (json?.chart?.result?.[0]) return json;
    } catch { /* try next proxy */ }
  }
  throw new Error("ทุก proxy ล้มเหลว");
}

/* ─────────────────────────────────────────────
   EXCHANGE RATE  (USD→THB)
───────────────────────────────────────────── */
let usdThb = null;

async function getUsdThb() {
  if (usdThb) return usdThb;
  try {
    // free, no-key API
    const r = await fetch("https://api.exchangerate-api.com/v4/latest/USD",
      { signal: AbortSignal.timeout(5000) });
    const d = await r.json();
    usdThb = d.rates?.THB || 33;
  } catch {
    usdThb = 33; // fallback
  }
  return usdThb;
}

/* ─────────────────────────────────────────────
   CHART
───────────────────────────────────────────── */
function drawChart(canvas, closes, up) {
  if (!canvas || closes.length < 2) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = rect.width  || canvas.offsetWidth;
  const h = rect.height || canvas.offsetHeight;
  canvas.width  = w * dpr;
  canvas.height = h * dpr;
  ctx.scale(dpr, dpr);

  const min = Math.min(...closes);
  const max = Math.max(...closes);
  const range = max - min || 1;
  const pad = 5;
  const color = up ? '#00e676' : '#ff5252';

  // fill
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, up ? 'rgba(0,230,118,0.25)' : 'rgba(255,82,82,0.25)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.moveTo(0, h);
  closes.forEach((v, i) => {
    const x = (i / (closes.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - pad * 2) - pad;
    ctx.lineTo(x, y);
  });
  ctx.lineTo(w, h);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // line
  ctx.beginPath();
  closes.forEach((v, i) => {
    const x = (i / (closes.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - pad * 2) - pad;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.8;
  ctx.lineJoin = 'round';
  ctx.stroke();
}

/* ─────────────────────────────────────────────
   RENDER SKELETON
───────────────────────────────────────────── */
function renderSkeleton() {
  const list = document.getElementById('list');
  list.innerHTML = COINS.map(c => `
    <div class="card loading" id="c-${c.sym}">
      <div class="card-top">
        <div>
          <div class="sym">${c.sym}</div>
          <div class="name">${c.name}</div>
        </div>
      </div>
      <div class="price skeleton" style="margin-top:12px"></div>
      <div class="change skeleton"></div>
      <div class="chart-wrap skeleton" style="margin-top:16px"></div>
    </div>`).join('');
}

/* ─────────────────────────────────────────────
   RENDER ONE CARD
───────────────────────────────────────────── */
function renderCard(card, c, d, rate) {
  const r      = d.chart.result[0];
  const meta   = r.meta;
  const closes = (r.indicators.quote[0].close || []).filter(v => v !== null);
  if (closes.length < 2) { card.innerHTML = `<div class="dim" style="padding:10px">ข้อมูลไม่เพียงพอ</div>`; return; }

  const now    = closes[closes.length - 1];
  const prev   = meta.previousClose || closes[0];
  const chg    = now - prev;
  const pct    = (chg / prev) * 100;
  const up     = chg >= 0;
  const cls    = up ? 'green' : 'red';
  const sign   = up ? '+' : '';
  const dayLow  = meta.regularMarketDayLow  ?? Math.min(...closes);
  const dayHigh = meta.regularMarketDayHigh ?? Math.max(...closes);
  const rangePct = dayHigh > dayLow
    ? ((now - dayLow) / (dayHigh - dayLow)) * 100
    : 50;
  const bahtVal  = (now * rate).toLocaleString('th-TH', { maximumFractionDigits: 0 });

  card.classList.remove('loading');
  card.innerHTML = `
    <div class="card-top">
      <div>
        <div class="sym">${c.sym}</div>
        <div class="name">${c.name}</div>
      </div>
      <span class="badge ${cls}">${sign}${pct.toFixed(2)}%</span>
    </div>
    <div class="price">${now.toFixed(2)}</div>
    <div class="change ${cls}">${sign}${chg.toFixed(2)} USD&nbsp;&nbsp;<span class="baht">≈ ${bahtVal} ฿</span></div>
    <div class="range-bar" style="margin-top:12px">
      <div class="range-fill" style="width:${rangePct.toFixed(1)}%;background:${up?'#00e676':'#ff5252'}"></div>
      <div class="range-dot" style="left:${rangePct.toFixed(1)}%;background:${up?'#00e676':'#ff5252'}"></div>
    </div>
    <div class="range-labels"><span>${dayLow.toFixed(2)}</span><span>Day Range</span><span>${dayHigh.toFixed(2)}</span></div>
    <div class="chart-wrap"><canvas id="cv-${c.sym}"></canvas></div>`;

  // draw chart after paint
  requestAnimationFrame(() => {
    const cv = card.querySelector(`#cv-${c.sym}`);
    if (cv) drawChart(cv, closes, up);
  });
}

/* ─────────────────────────────────────────────
   MAIN LOAD
───────────────────────────────────────────── */
let isLoading = false;

async function load() {
  if (isLoading) return;
  isLoading = true;

  const refreshBtn = document.getElementById('refreshBtn');
  const lastUpdatedEl = document.getElementById('lastUpdated');
  refreshBtn.classList.add('spinning');
  lastUpdatedEl.textContent = 'กำลังโหลด…';

  renderSkeleton();

  // fetch exchange rate + all stocks concurrently
  const [rate, ...results] = await Promise.all([
    getUsdThb(),
    ...COINS.map(c => fetchWithProxy(YAHOO_URL(c.sym)).catch(e => ({ error: e.message })))
  ]);

  let anyOk = false;
  results.forEach((d, i) => {
    const c = COINS[i];
    const card = document.getElementById(`c-${c.sym}`);
    if (!card) return;
    if (d?.error || !d?.chart?.result?.[0]) {
      card.classList.remove('loading');
      card.innerHTML = `
        <div class="sym">${c.sym}</div>
        <div class="name">${c.name}</div>
        <div class="error-box" style="padding:20px 0 0">
          <div class="icon">⚠️</div>
          <div>โหลดข้อมูลไม่ได้</div>
        </div>`;
    } else {
      renderCard(card, c, d, rate);
      anyOk = true;
    }
  });

  const now = new Date();
  lastUpdatedEl.textContent = anyOk
    ? `อัปเดต ${now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`
    : 'โหลดไม่สำเร็จ';

  refreshBtn.classList.remove('spinning');
  isLoading = false;
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
