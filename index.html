<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080c10">
<title>Hermes</title>
<style>
:root {
  --bg:      #080c10;
  --surface: #0f1923;
  --card:    #131e2a;
  --border:  #1c2d3e;
  --text:    #e8edf3;
  --sub:     #6b7f93;
  --green:   #00d97e;
  --red:     #ff4d6a;
  --blue:    #3b9eff;
  --radius:  18px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); }

.screen { position:fixed; inset:0; display:flex; flex-direction:column; transition:transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; will-change:transform; overflow:hidden; }
.screen.hidden { pointer-events:none; }
#screen-list.hidden   { transform:translateX(-100%); opacity:0; }
#screen-detail.hidden { transform:translateX(100%);  opacity:0; }

.topbar { display:flex; align-items:center; padding:16px 20px 12px; gap:12px; flex-shrink:0; background:var(--bg); }
.topbar-title { font-size:18px; font-weight:700; flex:1; }
.icon-btn { background:var(--card); border:1px solid var(--border); color:var(--sub); border-radius:12px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer; flex-shrink:0; }
.icon-btn:active { opacity:.7; }

.list-scroll { flex:1; overflow-y:auto; padding:0 16px 100px; }
.list-scroll::-webkit-scrollbar { display:none; }

.stock-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:10px; display:flex; align-items:center; gap:14px; cursor:pointer; transition:border-color .2s, transform .1s; position:relative; }
.stock-card:active { transform:scale(.985); border-color:var(--blue); }
.card-left { flex:1; min-width:0; }
.card-sym { font-size:16px; font-weight:700; }
.card-name { font-size:11px; color:var(--sub); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card-mid { flex:1; }
.card-mini-chart { height:36px; width:80px; }
.card-right { text-align:right; flex-shrink:0; }
.card-price { font-size:17px; font-weight:700; }
.card-chg { font-size:12px; margin-top:3px; }
.del-btn { position:absolute; right:-8px; top:-8px; width:22px; height:22px; border-radius:50%; background:#ff4d6a; color:#fff; border:none; font-size:13px; font-weight:700; display:none; align-items:center; justify-content:center; cursor:pointer; line-height:1; }
.edit-mode .del-btn { display:flex; }
.edit-mode .stock-card { border-color:#2a3a4a; }

.add-sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:50; display:flex; align-items:flex-end; transition:opacity .25s; }
.add-sheet-bg.hidden { opacity:0; pointer-events:none; }
.add-sheet { background:var(--surface); border-radius:24px 24px 0 0; padding:24px 20px 48px; width:100%; }
.add-sheet h3 { font-size:16px; font-weight:700; margin-bottom:16px; }
.sym-input { width:100%; background:var(--card); border:1.5px solid var(--border); border-radius:14px; color:var(--text); font-size:16px; padding:14px 16px; outline:none; margin-bottom:12px; transition:border-color .2s; }
.sym-input:focus { border-color:var(--blue); }
.sym-input::placeholder { color:var(--sub); }
.add-btn-main { width:100%; background:var(--blue); color:#fff; border:none; border-radius:14px; padding:15px; font-size:15px; font-weight:600; cursor:pointer; }
.add-btn-main:active { opacity:.8; }
.add-hint { font-size:11px; color:var(--sub); text-align:center; margin-top:10px; }
.error-tag { color:var(--red); font-size:12px; padding:4px 0; }

.detail-top { padding:12px 20px 0; flex-shrink:0; }
.detail-sym { font-size:28px; font-weight:800; line-height:1; }
.detail-name { font-size:13px; color:var(--sub); margin-top:4px; }
.detail-price-row { display:flex; align-items:flex-end; gap:12px; margin-top:14px; }
.detail-price { font-size:42px; font-weight:800; line-height:1; }
.detail-chg { font-size:14px; font-weight:600; margin-bottom:6px; }
.detail-baht { font-size:13px; color:var(--sub); margin-top:6px; }
.detail-status { display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--sub); margin-top:6px; padding:4px 10px; background:var(--card); border-radius:20px; border:1px solid var(--border); }
.dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.dot.open   { background:var(--green); box-shadow:0 0 6px var(--green); }
.dot.closed { background:var(--sub); }

.range-wrap { padding:0 20px; margin-top:16px; flex-shrink:0; }
.range-bar { height:3px; background:var(--border); border-radius:3px; position:relative; margin:6px 0 4px; }
.range-fill { height:100%; border-radius:3px; position:absolute; left:0; }
.range-dot-el { position:absolute; top:50%; transform:translate(-50%,-50%); width:10px; height:10px; border-radius:50%; border:2px solid var(--bg); }
.range-labels { display:flex; justify-content:space-between; font-size:10px; color:var(--sub); }

.chart-area { flex:1; padding:8px 0 0; position:relative; min-height:0; }
.chart-area canvas { position:absolute; inset:0; width:100%; height:100%; }
.chart-loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:13px; }

.time-tabs { display:flex; padding:10px 20px; gap:6px; flex-shrink:0; background:var(--bg); }
.tab { flex:1; background:var(--card); border:1px solid var(--border); color:var(--sub); border-radius:10px; padding:8px 0; font-size:13px; font-weight:600; cursor:pointer; text-align:center; transition:background .15s, color .15s; }
.tab.active { background:var(--blue); color:#fff; border-color:var(--blue); }

.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:12px 20px 24px; flex-shrink:0; }
.stat-box { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 14px; }
.stat-label { font-size:10px; color:var(--sub); text-transform:uppercase; letter-spacing:.5px; }
.stat-val { font-size:16px; font-weight:700; margin-top:4px; }

.empty-state { text-align:center; padding:60px 20px; color:var(--sub); }
.empty-state .ico { font-size:48px; margin-bottom:14px; }
.empty-state p { font-size:14px; line-height:1.7; }

.skel { background:var(--border); border-radius:6px; animation:shimmer 1.4s infinite; }
@keyframes shimmer { 0%,100%{opacity:.5} 50%{opacity:1} }

.fab { position:fixed; bottom:28px; right:20px; width:56px; height:56px; border-radius:50%; background:var(--blue); color:#fff; font-size:26px; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 20px rgba(59,158,255,.45); transition:transform .15s; z-index:10; }
.fab:active { transform:scale(.92); }
</style>
</head>
<body>

<!-- LIST SCREEN -->
<div class="screen" id="screen-list">
  <div class="topbar">
    <div class="topbar-title">📈 Hermes</div>
    <div class="icon-btn" id="editBtn">✏️</div>
  </div>
  <div class="list-scroll" id="stockList">
    <div class="empty-state"><div class="ico">📉</div><p>กำลังโหลด…</p></div>
  </div>
  <button class="fab" id="addFab">+</button>
</div>

<!-- DETAIL SCREEN -->
<div class="screen hidden" id="screen-detail">
  <div class="topbar">
    <div class="icon-btn" id="backBtn" style="font-size:22px">←</div>
    <div class="topbar-title" id="det-topbar-sym"></div>
    <div style="width:38px"></div>
  </div>
  <div class="detail-top">
    <div class="detail-sym" id="det-sym"></div>
    <div class="detail-name" id="det-name"></div>
    <div class="detail-price-row">
      <div class="detail-price" id="det-price">–</div>
      <div class="detail-chg" id="det-chg"></div>
    </div>
    <div class="detail-baht" id="det-baht"></div>
    <div class="detail-status">
      <span class="dot closed" id="det-dot"></span>
      <span id="det-status-txt">–</span>
    </div>
  </div>
  <div class="range-wrap" id="det-range-wrap" style="display:none">
    <div class="range-labels">
      <span id="rng-lo"></span>
      <span style="color:var(--sub);font-size:10px">ช่วงวันนี้</span>
      <span id="rng-hi"></span>
    </div>
    <div class="range-bar">
      <div class="range-fill" id="rng-fill"></div>
      <div class="range-dot-el" id="rng-dot"></div>
    </div>
  </div>
  <div class="time-tabs" id="timeTabs">
    <div class="tab active" data-tf="1D">1D</div>
    <div class="tab" data-tf="5D">5D</div>
    <div class="tab" data-tf="1M">1M</div>
    <div class="tab" data-tf="6M">6M</div>
    <div class="tab" data-tf="1Y">1Y</div>
  </div>
  <div class="chart-area" id="chartArea">
    <canvas id="mainCanvas"></canvas>
    <div class="chart-loading" id="chartLoading">กำลังโหลดกราฟ…</div>
  </div>
  <div class="stat-grid" id="statGrid"></div>
</div>

<!-- ADD SHEET -->
<div class="add-sheet-bg hidden" id="addSheet">
  <div class="add-sheet">
    <h3>เพิ่มหุ้น / ETF</h3>
    <input class="sym-input" id="symInput" placeholder="เช่น AAPL, QQQ, MSFT" autocapitalize="characters" autocomplete="off" spellcheck="false">
    <div class="error-tag" id="addError"></div>
    <button class="add-btn-main" id="confirmAdd">เพิ่ม</button>
    <div class="add-hint">ใช้ symbol เดียวกับ Yahoo Finance / Twelve Data</div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════
   CONFIG
═══════════════════════════════════════ */
const TD_KEY = "457c304f76fe4a0f9280acab2b066165";
const TD_BASE = "https://api.twelvedata.com";

const DEFAULT_SYMS = [
  { sym:"VOO",  name:"Vanguard S&P 500 ETF" },
  { sym:"NVDA", name:"NVIDIA Corp" },
  { sym:"JEPQ", name:"JPMorgan Nasdaq Equity ETF" }
];

// Twelve Data timeframe map → { interval, outputsize }
const TF_MAP = {
  "1D": { interval:"5min",  outputsize:78  },
  "5D": { interval:"15min", outputsize:130 },
  "1M": { interval:"1h",    outputsize:160 },
  "6M": { interval:"1day",  outputsize:130 },
  "1Y": { interval:"1week", outputsize:52  }
};

/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
let stocks     = [];
let editMode   = false;
let usdThb     = 33;
let db         = null;
let currentSym = null;
let currentTf  = "1D";
let detailTimer = null;

// cache: sym → { ts, data }  (TTL 55s)
const cache = {};
function getCache(key) {
  const c = cache[key];
  if (!c) return null;
  if (Date.now() - c.ts > 55000) return null;
  return c.data;
}
function setCache(key, data) { cache[key] = { ts: Date.now(), data }; }

/* ═══════════════════════════════════════
   DB
═══════════════════════════════════════ */
async function initDb() {
  try { db = await claude.use("db"); } catch { db = null; }
  if (!db) return;
  const snap = await db.doc("data/stocks").get();
  if (snap.exists) {
    const d = snap.data();
    if (Array.isArray(d.list) && d.list.length > 0) { stocks = d.list; return; }
  }
  stocks = [...DEFAULT_SYMS];
  await db.doc("data/stocks").set({ list: stocks });
}
async function saveStocks() {
  if (db) try { await db.doc("data/stocks").set({ list: stocks }); } catch {}
}

/* ═══════════════════════════════════════
   TWELVE DATA FETCH
═══════════════════════════════════════ */
// ดึงราคา + เปลี่ยนแปลงวันเดียว (quote endpoint — เร็วมาก 1 call)
async function tdQuote(sym) {
  const key = `q_${sym}`;
  const hit = getCache(key);
  if (hit) return hit;
  const url = `${TD_BASE}/quote?symbol=${sym}&apikey=${TD_KEY}`;
  const r = await fetch(url, { signal: AbortSignal.timeout(6000) });
  const d = await r.json();
  if (d.status === "error" || !d.close) throw new Error(d.message || "ไม่พบ");
  setCache(key, d);
  return d;
}

// ดึง time series สำหรับกราฟ
async function tdSeries(sym, tf) {
  const { interval, outputsize } = TF_MAP[tf];
  const key = `ts_${sym}_${tf}`;
  const hit = getCache(key);
  if (hit) return hit;
  const url = `${TD_BASE}/time_series?symbol=${sym}&interval=${interval}&outputsize=${outputsize}&apikey=${TD_KEY}`;
  const r = await fetch(url, { signal: AbortSignal.timeout(8000) });
  const d = await r.json();
  if (d.status === "error" || !d.values) throw new Error(d.message || "ไม่พบข้อมูลกราฟ");
  // values เรียงใหม่สุดก่อน → กลับให้เก่าก่อน
  d.values = d.values.slice().reverse();
  setCache(key, d);
  return d;
}

// อัตราแลกเปลี่ยน
async function getRate() {
  try {
    const r = await fetch("https://api.exchangerate-api.com/v4/latest/USD",
      { signal: AbortSignal.timeout(5000) });
    const d = await r.json();
    usdThb = d.rates?.THB || 33;
  } catch { usdThb = 33; }
}

/* ═══════════════════════════════════════
   CHARTS
═══════════════════════════════════════ */
function drawMini(canvas, closes, up) {
  if (!canvas || closes.length < 2) return;
  const ctx = canvas.getContext("2d");
  const dpr = devicePixelRatio || 1;
  const w = canvas.offsetWidth, h = canvas.offsetHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.scale(dpr, dpr);
  const mn = Math.min(...closes), mx = Math.max(...closes);
  const rng = mx - mn || 1;
  ctx.beginPath();
  closes.forEach((v, i) => {
    const x = (i / (closes.length - 1)) * w;
    const y = h - ((v - mn) / rng) * (h - 4) - 2;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = up ? "#00d97e" : "#ff4d6a";
  ctx.lineWidth = 1.5; ctx.lineJoin = "round"; ctx.stroke();
}

function drawMain(canvas, closes, labels, up) {
  if (!canvas || closes.length < 2) return;
  const ctx = canvas.getContext("2d");
  const dpr = devicePixelRatio || 1;
  const w = canvas.offsetWidth  || canvas.parentElement?.offsetWidth  || 320;
  const h = canvas.offsetHeight || canvas.parentElement?.offsetHeight || 160;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.scale(dpr, dpr);

  const padT=12, padB=36, padL=12, padR=12;
  const cw = w-padL-padR, ch = h-padT-padB;
  const mn = Math.min(...closes), mx = Math.max(...closes);
  const rng = mx - mn || 1;
  const color = up ? "#00d97e" : "#ff4d6a";
  const px = i => padL + (i/(closes.length-1))*cw;
  const py = v => padT + ch - ((v-mn)/rng)*ch;

  // grid
  ctx.strokeStyle = "rgba(255,255,255,0.04)"; ctx.lineWidth = 1;
  for (let k=0; k<=4; k++) {
    const y = padT+(k/4)*ch;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+cw,y); ctx.stroke();
  }

  // fill
  const grad = ctx.createLinearGradient(0,padT,0,padT+ch);
  grad.addColorStop(0, up?"rgba(0,217,126,.25)":"rgba(255,77,106,.25)");
  grad.addColorStop(1,"rgba(0,0,0,0)");
  ctx.beginPath();
  ctx.moveTo(px(0), padT+ch);
  closes.forEach((v,i) => ctx.lineTo(px(i), py(v)));
  ctx.lineTo(px(closes.length-1), padT+ch);
  ctx.closePath(); ctx.fillStyle=grad; ctx.fill();

  // line
  ctx.beginPath();
  closes.forEach((v,i) => i===0 ? ctx.moveTo(px(i),py(v)) : ctx.lineTo(px(i),py(v)));
  ctx.strokeStyle=color; ctx.lineWidth=2; ctx.lineJoin="round"; ctx.stroke();

  // time labels
  if (labels?.length) {
    ctx.fillStyle="rgba(107,127,147,.8)";
    ctx.font=`10px -apple-system,sans-serif`;
    ctx.textAlign="center";
    const steps = Math.min(4, closes.length-1);
    for (let k=0; k<=steps; k++) {
      const idx = Math.round((k/steps)*(closes.length-1));
      if (labels[idx]) ctx.fillText(labels[idx], px(idx), padT+ch+22);
    }
  }
}

/* ═══════════════════════════════════════
   LIST RENDER
═══════════════════════════════════════ */
const priceCache = {};

function renderList() {
  const el = document.getElementById("stockList");
  if (!stocks.length) {
    el.innerHTML = `<div class="empty-state"><div class="ico">📋</div><p>ยังไม่มีหุ้น<br>กด + เพิ่มได้เลย</p></div>`;
    return;
  }
  el.innerHTML = stocks.map(s => {
    const p = priceCache[s.sym];
    const priceHtml = p
      ? `<div class="card-price">${parseFloat(p.now).toFixed(2)}</div>
         <div class="card-chg ${p.up?'green':'red'}">${p.up?"+":""}${p.pct.toFixed(2)}%</div>`
      : `<div class="card-price skel" style="width:70px;height:18px;margin-bottom:6px"></div>
         <div class="skel" style="width:50px;height:12px"></div>`;
    return `<div class="stock-card" data-sym="${s.sym}">
      <div class="card-left">
        <div class="card-sym">${s.sym}</div>
        <div class="card-name">${s.name}</div>
      </div>
      <div class="card-mid"><canvas class="card-mini-chart" id="mini-${s.sym}"></canvas></div>
      <div class="card-right">${priceHtml}</div>
      <button class="del-btn" data-sym="${s.sym}">×</button>
    </div>`;
  }).join("");

  el.querySelectorAll(".stock-card").forEach(c => {
    c.addEventListener("click", e => { if (!editMode) openDetail(c.dataset.sym); });
  });
  el.querySelectorAll(".del-btn").forEach(b => {
    b.addEventListener("click", e => { e.stopPropagation(); removeSym(b.dataset.sym); });
  });

  // draw mini charts
  Object.entries(priceCache).forEach(([sym, p]) => {
    if (!p?.closes?.length) return;
    const cv = document.getElementById(`mini-${sym}`);
    if (cv) requestAnimationFrame(() => drawMini(cv, p.closes, p.up));
  });

  el.classList.toggle("edit-mode", editMode);
}

/* ═══════════════════════════════════════
   LOAD LIST
═══════════════════════════════════════ */
async function loadListPrices() {
  renderList();
  // โหลดทุกหุ้นพร้อมกัน (parallel) ด้วย quote + time_series 1D
  await Promise.all(stocks.map(async s => {
    try {
      const [q, ts] = await Promise.all([
        tdQuote(s.sym),
        tdSeries(s.sym, "1D")
      ]);
      const now  = parseFloat(q.close);
      const prev = parseFloat(q.previous_close);
      const chg  = now - prev;
      const pct  = (chg/prev)*100;
      const closes = ts.values.map(v => parseFloat(v.close));
      priceCache[s.sym] = { now, prev, chg, pct, up: chg>=0, closes };
    } catch { /* ข้ามถ้า error */ }
  }));
  renderList();
}

/* ═══════════════════════════════════════
   DETAIL
═══════════════════════════════════════ */
function openDetail(sym) {
  const s = stocks.find(x => x.sym === sym);
  currentSym = sym;
  currentTf  = "1D";

  document.getElementById("det-topbar-sym").textContent = sym;
  document.getElementById("det-sym").textContent = sym;
  document.getElementById("det-name").textContent = s?.name || sym;
  document.getElementById("det-price").textContent = "–";
  document.getElementById("det-chg").textContent = "";
  document.getElementById("det-baht").textContent = "";
  document.getElementById("det-range-wrap").style.display = "none";
  document.getElementById("statGrid").innerHTML = "";
  document.getElementById("chartLoading").style.display = "flex";
  document.getElementById("chartLoading").textContent = "กำลังโหลดกราฟ…";

  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("active", t.dataset.tf === "1D"));

  showScreen("detail");
  loadDetail(sym, "1D");

  clearInterval(detailTimer);
  detailTimer = setInterval(() => {
    if (currentSym === sym) loadDetail(sym, currentTf);
  }, 60000);
}

function closeDetail() {
  clearInterval(detailTimer);
  currentSym = null;
  showScreen("list");
  loadListPrices();
}

async function loadDetail(sym, tf) {
  document.getElementById("chartLoading").style.display = "flex";
  document.getElementById("chartLoading").textContent = "กำลังโหลดกราฟ…";
  try {
    // โหลด quote + time_series พร้อมกัน
    const [q, ts] = await Promise.all([
      tdQuote(sym),
      tdSeries(sym, tf)
    ]);
    if (currentSym !== sym) return;

    const now  = parseFloat(q.close);
    const prev = parseFloat(q.previous_close);
    const hi   = parseFloat(q.high);
    const lo   = parseFloat(q.low);
    const open = parseFloat(q.open);
    const chg  = now - prev;
    const pct  = (chg/prev)*100;
    const up   = chg >= 0;
    const color = up ? "var(--green)" : "var(--red)";
    const sign  = up ? "+" : "";

    // ราคา
    document.getElementById("det-price").textContent = now.toFixed(2);
    document.getElementById("det-price").style.color = color;
    const chgEl = document.getElementById("det-chg");
    chgEl.textContent = `${sign}${chg.toFixed(2)} (${sign}${pct.toFixed(2)}%)`;
    chgEl.style.color = color;
    document.getElementById("det-baht").textContent =
      `≈ ${(now*usdThb).toLocaleString("th-TH",{maximumFractionDigits:0})} บาท`;

    // market status
    const isOpen = q.is_market_open;
    document.getElementById("det-dot").className = `dot ${isOpen?"open":"closed"}`;
    document.getElementById("det-status-txt").textContent = isOpen ? "ตลาดเปิด" : "ตลาดปิด";

    // range bar (1D only)
    if (tf === "1D" && hi && lo) {
      const pct2 = hi>lo ? ((now-lo)/(hi-lo))*100 : 50;
      document.getElementById("rng-lo").textContent = lo.toFixed(2);
      document.getElementById("rng-hi").textContent = hi.toFixed(2);
      document.getElementById("rng-fill").style.cssText = `width:${pct2.toFixed(1)}%;background:${color}`;
      document.getElementById("rng-dot").style.cssText  = `left:${pct2.toFixed(1)}%;background:${color}`;
      document.getElementById("det-range-wrap").style.display = "block";
    } else {
      document.getElementById("det-range-wrap").style.display = "none";
    }

    // กราฟ
    const closes = ts.values.map(v => parseFloat(v.close));
    const labels = ts.values.map(v => {
      const d = new Date(v.datetime);
      return tf==="1D"||tf==="5D"
        ? d.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})
        : d.toLocaleDateString("th-TH",{month:"short",day:"numeric"});
    });
    const canvas = document.getElementById("mainCanvas");
    document.getElementById("chartLoading").style.display = "none";
    requestAnimationFrame(() => drawMain(canvas, closes, labels, up));

    // stats
    const fi = q.fifty_two_week || {};
    const vol = parseFloat(q.volume||0);
    const mktCap = parseFloat(q.market_cap||0);
    const fmtCap = mktCap>=1e12?(mktCap/1e12).toFixed(2)+"T"
                  :mktCap>=1e9?(mktCap/1e9).toFixed(2)+"B"
                  :mktCap>0?(mktCap/1e6).toFixed(0)+"M":"–";
    document.getElementById("statGrid").innerHTML = `
      <div class="stat-box"><div class="stat-label">เปิด</div><div class="stat-val">${open.toFixed(2)}</div></div>
      <div class="stat-box"><div class="stat-label">ปิดก่อนหน้า</div><div class="stat-val">${prev.toFixed(2)}</div></div>
      <div class="stat-box"><div class="stat-label">52W High</div><div class="stat-val" style="color:var(--green)">${fi.high||"–"}</div></div>
      <div class="stat-box"><div class="stat-label">52W Low</div><div class="stat-val" style="color:var(--red)">${fi.low||"–"}</div></div>
      <div class="stat-box"><div class="stat-label">Mkt Cap</div><div class="stat-val">${fmtCap}</div></div>
      <div class="stat-box"><div class="stat-label">Volume</div><div class="stat-val">${vol>0?(vol/1e6).toFixed(1)+"M":"–"}</div></div>`;
  } catch(e) {
    document.getElementById("chartLoading").textContent = "โหลดไม่ได้: "+e.message;
  }
}

/* ═══════════════════════════════════════
   ADD / REMOVE
═══════════════════════════════════════ */
async function addSym(raw) {
  const sym = raw.trim().toUpperCase();
  if (!sym) return "กรอก symbol ก่อน";
  if (stocks.find(s => s.sym === sym)) return `${sym} มีอยู่แล้ว`;
  document.getElementById("addError").textContent = "กำลังตรวจสอบ…";
  try {
    const q = await tdQuote(sym);
    const name = q.name || sym;
    stocks.push({ sym, name });
    await saveStocks();
    return null;
  } catch(e) { return "ไม่พบ symbol: "+e.message; }
}

async function removeSym(sym) {
  stocks = stocks.filter(s => s.sym !== sym);
  delete priceCache[sym];
  await saveStocks();
  renderList();
}

/* ═══════════════════════════════════════
   SCREENS / EVENTS
═══════════════════════════════════════ */
function showScreen(name) {
  document.getElementById("screen-list").classList.toggle("hidden", name!=="list");
  document.getElementById("screen-detail").classList.toggle("hidden", name!=="detail");
}

document.getElementById("backBtn").addEventListener("click", closeDetail);

document.getElementById("timeTabs").addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (!tab || !currentSym) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  tab.classList.add("active");
  currentTf = tab.dataset.tf;
  loadDetail(currentSym, currentTf);
});

document.getElementById("editBtn").addEventListener("click", () => {
  editMode = !editMode;
  document.getElementById("editBtn").textContent = editMode ? "✅" : "✏️";
  renderList();
});

document.getElementById("addFab").addEventListener("click", () => {
  document.getElementById("addSheet").classList.remove("hidden");
  document.getElementById("symInput").value = "";
  document.getElementById("addError").textContent = "";
  setTimeout(() => document.getElementById("symInput").focus(), 100);
});

document.getElementById("addSheet").addEventListener("click", e => {
  if (e.target === document.getElementById("addSheet"))
    document.getElementById("addSheet").classList.add("hidden");
});

document.getElementById("confirmAdd").addEventListener("click", async () => {
  const btn = document.getElementById("confirmAdd");
  btn.disabled = true; btn.textContent = "กำลังเพิ่ม…";
  const err = await addSym(document.getElementById("symInput").value);
  btn.disabled = false; btn.textContent = "เพิ่ม";
  if (err) { document.getElementById("addError").textContent = err; return; }
  document.getElementById("addSheet").classList.add("hidden");
  await loadListPrices();
});

document.getElementById("symInput").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("confirmAdd").click();
});

window.addEventListener("resize", () => {
  if (currentSym) loadDetail(currentSym, currentTf);
});

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
(async () => {
  await Promise.all([initDb(), getRate()]);
  if (!stocks.length) stocks = [...DEFAULT_SYMS];
  await loadListPrices();
  setInterval(loadListPrices, 60000);
})();
</script>
</body>
