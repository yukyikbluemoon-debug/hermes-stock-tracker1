<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e13">
<title>Stock Tracker</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,sans-serif; background:#0a0e13; color:#e6edf3; padding:20px; }
  h1 { font-size:18px; margin-bottom:16px; }
  .card { background:#141b24; border:1px solid #2a3441; border-radius:16px; padding:18px; margin-bottom:12px; }
  .sym { font-size:14px; font-weight:600; }
  .name { font-size:11px; color:#7d8590; margin-top:2px; }
  .price { font-size:26px; font-weight:700; margin-top:8px; }
  .change { font-size:13px; margin-top:4px; }
  .green { color:#00e676; }
  .red { color:#ff5252; }
  .baht { font-size:11px; color:#7d8590; margin-top:4px; }
  .loading { color:#7d8590; }
</style>
</head>
<body>
<h1>📈 Hermes</h1>
<div id="list"></div>

<script>
const COINS = [
  { sym:"VOO", name:"S&P 500 ETF" },
  { sym:"NVDA", name:"NVIDIA Corp" },
  { sym:"JEPQ", name:"JEPQ ETF" }
];

const URLS = COINS.map(c => `https://query1.finance.yahoo.com/v8/finance/chart/${c.sym}?range=1d&interval=2m`);

async function load() {
  const list = document.getElementById('list');

  // Show loading cards immediately
  list.innerHTML = COINS.map(c => `<div class="card">
    <div class="sym">${c.sym}</div><div class="name">${c.name}</div>
    <div class="price loading">Loading...</div></div>`).join('');

  try {
    const responses = await Promise.all(URLS.map(u => fetch(u, { headers: { "User-Agent": "Mozilla/5.0" } })));
    const data = await Promise.all(responses.map(r => r.json()));

    let html = '';
    data.forEach((d, i) => {
      const c = COINS[i];
      const r = d.chart.result[0];
      const meta = r.meta;
      const quotes = r.indicators.quote[0];
      const closes = quotes.close.filter(v => v !== null);
      const now = closes[closes.length - 1];
      const prev = meta.previousClose;
      const chg = now - prev;
      const pct = (chg / prev) * 100;
      const up = chg >= 0;
      const cls = up ? 'green' : 'red';
      const sign = up ? '+' : '';

      html += `<div class="card">
        <div class="sym">${c.sym}</div><div class="name">${c.name}</div>
        <div class="price">${now.toFixed(2)}</div>
        <div class="change ${cls}">${sign}${chg.toFixed(2)} (${sign}${pct.toFixed(2)}%)</div>
        <div class="baht">≈ ${(now * 32.67).toFixed(0)} บาท</div>
      </div>`;
    });
    list.innerHTML = html;
  } catch(e) {
    list.innerHTML = '<div style="text-align:center;color:#ff5252;padding:40px">ไม่สามารถโหลดข้อมูลได้<br>ลองใหม่อีกครั้ง</div>';
  }
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
