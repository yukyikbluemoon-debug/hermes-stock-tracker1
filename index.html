<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Stock Tracker</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --bg: #0a0e13; --card: #141b24; --border: #2a3441;
    --text: #e6edf3; --dim: #7d8590; --green: #00e676; --red: #ff5252;
    --green-bg: rgba(0,230,118,0.1); --red-bg: rgba(255,82,82,0.1);
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background: var(--bg); color: var(--text); min-height: 100vh; padding: 0; }
  .app { max-width:430px; margin:0 auto; padding: 20px 16px; }
  .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; padding-top:8px; }
  .header h1 { font-size:18px; font-weight:600; }
  .time { color:var(--dim); font-size:12px; }
  .coin-card { background:var(--card); border-radius:16px; padding:20px; margin-bottom:12px;
               border:1px solid var(--border); position:relative; overflow:hidden; }
  .coin-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .sym { font-size:14px; font-weight:600; letter-spacing:0.5px; }
  .label { font-size:11px; color:var(--dim); margin-top:2px; }
  .price-block { text-align:right; }
  .price { font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; }
  .change { font-size:13px; margin-top:4px; font-weight:500; }
  .up { color:var(--green); }
  .down { color:var(--red); }
  .chart-wrap { margin-top:12px; height:120px; position:relative; }
  .chart-wrap canvas { width:100%; height:100%; }
  .baht { font-size:11px; color:var(--dim); margin-top:4px; }
  .footer { display:none; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>📈 Hermes</h1>
    <span class="time" id="clock">-</span>
  </div>
  <div id="list"></div>
</div>
<div class="footer">Hermes Stock Tracker · Yahoo Finance · Auto-refresh 60s</div>

<script>
const COINS = [
  { sym:"VOO", name:"S&P 500 ETF", bahtRate:32.67 },
  { sym:"NVDA", name:"NVIDIA Corp", bahtRate:32.67 },
  { sym:"JEPQ", name:"JEPQ ETF", bahtRate:32.67 }
];

async function fetchData(sym) {
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?range=1d&interval=2m`;
  const resp = await fetch(url, { headers: { "User-Agent": "Mozilla/5.0" } });
  const data = await resp.json();
  const r = data.chart.result[0];
  const meta = r.meta;
  const quotes = r.indicators.quote[0];
  const closes = quotes.close.filter(v => v !== null);
  const timestamps = r.timestamp.filter((t,i) => quotes.close[i] !== null);
  const now = closes[closes.length - 1];
  const prev = meta.previousClose;
  const chg = now - prev;
  const pct = (chg / prev) * 100;
  return { price: now, prev, change: chg, pct, closes, timestamps, meta };
}

function drawChart(canvas, closes, up) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.offsetWidth;
  const h = canvas.offsetHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.scale(dpr, dpr);

  const min = Math.min(...closes);
  const max = Math.max(...closes);
  const range = max - min || 1;
  const pad = 4;

  // Gradient fill
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  if (up) {
    grad.addColorStop(0, 'rgba(0,230,118,0.3)');
    grad.addColorStop(1, 'rgba(0,230,118,0.0)');
  } else {
    grad.addColorStop(0, 'rgba(255,82,82,0.3)');
    grad.addColorStop(1, 'rgba(255,82,82,0.0)');
  }

  ctx.beginPath();
  ctx.moveTo(0, h);
  closes.forEach((v, i) => {
    const x = (i / (closes.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - pad * 2) - pad;
    if (i === 0) ctx.lineTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.lineTo(w, h);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Line
  ctx.beginPath();
  closes.forEach((v, i) => {
    const x = (i / (closes.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - pad * 2) - pad;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = up ? '#00e676' : '#ff5252';
  ctx.lineWidth = 2;
  ctx.stroke();
}

async function load() {
  const list = document.getElementById('list');
  list.innerHTML = COINS.map(c => `
    <div class="coin-card" id="c-${c.sym}">
      <div class="coin-top">
        <div>
          <div class="sym">${c.sym}</div>
          <div class="label">${c.name}</div>
        </div>
        <div class="price-block">
          <div class="price">--</div>
          <div class="change">-</div>
          <div class="baht">-</div>
        </div>
      </div>
      <div class="chart-wrap"><canvas></canvas></div>
    </div>
  `).join('');

  for (const c of COINS) {
    try {
      const d = await fetchData(c.sym);
      const up = d.change >= 0;
      const cls = up ? 'up' : 'down';
      const sign = up ? '+' : '';
      const card = document.getElementById(`c-${c.sym}`);
      const priceEl = card.querySelector('.price');
      const changeEl = card.querySelector('.change');
      const bahtEl = card.querySelector('.baht');
      priceEl.textContent = d.price.toFixed(2);
      changeEl.className = `change ${cls}`;
      changeEl.textContent = `${sign}${d.change.toFixed(2)} (${sign}${d.pct.toFixed(2)}%)`;
      bahtEl.textContent = `≈ ${(d.price * c.bahtRate).toFixed(0)} บาท`;

      const canvas = card.querySelector('canvas');
      drawChart(canvas, d.closes, up);
    } catch(e) {
      const card = document.getElementById(`c-${c.sym}`);
      card.querySelector('.price').textContent = 'Error';
    }
  }
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('th-TH', {hour:'2-digit',minute:'2-digit'});
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
